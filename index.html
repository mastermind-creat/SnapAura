    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#4FD1C5",
              secondary: "#6366F1",
              accent: "#F472B6",
              surface: "#12141c",
              dark: {
                900: "#0a0b10",
                800: "#12141c",
                700: "#1e212d",
                600: "#292d3e"
              }
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'fade-in': 'fadeIn 0.3s ease-out forwards',
              'fade-in-up': 'fadeInUp 0.4s ease-out forwards',
              'spin-slow': 'spin 20s linear infinite',
              'liquid-blob-1': 'liquidBlob1 10s ease-in-out infinite',
              'liquid-blob-2': 'liquidBlob2 12s ease-in-out infinite',
              'liquid-blob-3': 'liquidBlob3 14s ease-in-out infinite',
              'shimmer': 'shimmer 2.5s linear infinite',
              'text-sheen': 'textSheen 6s ease-in-out infinite',
              'scan': 'scan 4s linear infinite',
              'hue-rotate': 'hueRotate 15s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' }
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' }
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' }
              },
              liquidBlob1: {
                '0%, 100%': { transform: 'translate(0, 0) scale(1) rotate(0deg)', borderRadius: '60% 40% 30% 70% / 60% 30% 70% 40%' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1) rotate(120deg)', borderRadius: '30% 60% 70% 40% / 50% 60% 30% 60%' },
                '66%': { transform: 'translate(-20px, 40px) scale(0.9) rotate(240deg)', borderRadius: '50% 50% 20% 80% / 25% 80% 20% 75%' }
              },
              liquidBlob2: {
                '0%, 100%': { transform: 'translate(0, 0) scale(1) rotate(0deg)', borderRadius: '40% 60% 70% 30% / 40% 50% 60% 70%' },
                '33%': { transform: 'translate(-40px, 30px) scale(1.2) rotate(-120deg)', borderRadius: '70% 30% 50% 50% / 30% 30% 70% 70%' },
                '66%': { transform: 'translate(40px, -20px) scale(0.8) rotate(-240deg)', borderRadius: '20% 80% 40% 60% / 60% 20% 80% 40%' }
              },
              liquidBlob3: {
                '0%, 100%': { transform: 'translate(0, 0) scale(1) rotate(0deg)', borderRadius: '50%' },
                '50%': { transform: 'translate(-30px, -30px) scale(1.3) rotate(180deg)', borderRadius: '40% 60% 40% 60% / 60% 40% 60% 40%' }
              },
              hueRotate: {
                'from': { filter: 'hue-rotate(0deg)' },
                'to': { filter: 'hue-rotate(360deg)' }
              },
              textSheen: {
                '0%, 100%': { backgroundPosition: '200% center' },
                '50%': { backgroundPosition: '0% center' }
              },
              scan: {
                '0%': { top: '-10%', opacity: '0' },
                '10%': { opacity: '1' },
                '90%': { opacity: '1' },
                '100%': { top: '110%', opacity: '0' }
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0a0b10;
        color: #e2e8f0;
        font-family: 'Inter', -apple-system, sans-serif;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      .glass-panel {
        background: rgba(18, 20, 28, 0.7);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .shadow-neu {
        box-shadow: 12px 12px 24px rgba(0, 0, 0, 0.4), -8px -8px 16px rgba(255, 255, 255, 0.03);
      }
      .shadow-neu-pressed {
        box-shadow: inset 6px 6px 12px rgba(0, 0, 0, 0.5), inset -4px -4px 10px rgba(255, 255, 255, 0.02);
      }
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      .premium-title {
        background: linear-gradient(135deg, #ffffff 0%, #4FD1C5 50%, #ffffff 100%);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: textSheen 10s ease infinite;
      }

      /* METABALL CONTAINER EFFECT */
      .metaball-container {
        filter: blur(25px) contrast(25);
        background: transparent;
        mix-blend-mode: screen;
      }

      .liquid-blob {
        position: absolute;
        width: 140px;
        height: 140px;
        filter: blur(2px);
      }

      .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
